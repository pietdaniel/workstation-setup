---
# Ensure Homebrew is installed and updated (macOS only)

- name: Check if Homebrew is installed
  ansible.builtin.command: which brew
  register: brew_installed
  ignore_errors: yes
  changed_when: false

- name: Install Homebrew
  ansible.builtin.shell: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  when: brew_installed.rc != 0

- name: Update Homebrew
  community.general.homebrew:
    update_homebrew: yes

- name: Check if Chrome is already installed
  ansible.builtin.stat:
    path: /Applications/Google Chrome.app
  register: chrome_app

- name: Install Chrome when missing
  community.general.homebrew_cask:
    name: google-chrome
    state: present
  when: not chrome_app.stat.exists
  environment:
    # Google's rolling download has no fixed checksum; retain other cask options.
    HOMEBREW_CASK_OPTS: "{{ ansible_facts['env'].get('HOMEBREW_CASK_OPTS', '') | replace('--require-sha', '') }}"

- name: Verify Chrome is signed by Google
  ansible.builtin.command:
    argv:
      - /usr/bin/codesign
      - --verify
      - --deep
      - --strict
      - -R
      - '=anchor apple generic and certificate leaf[subject.OU] = "EQHXZ8M8AV"'
      - /Applications/Google Chrome.app
  changed_when: false

- name: Ask Chrome to become the default browser
  ansible.builtin.command:
    argv:
      - open
      - -a
      - Google Chrome
      - --args
      - --make-default-browser
  changed_when: false
